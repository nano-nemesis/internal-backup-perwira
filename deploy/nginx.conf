# internal-backup-perwira — nginx + php-fpm
#
# SPA React dilayani LANGSUNG oleh nginx dari frontend/dist.
# Hanya /api dan /sanctum yang masuk ke Laravel lewat soket php-fpm.
#
# Menggantikan konfigurasi lama yang mem-proxy ke `artisan serve` di :8000.
# `artisan serve` adalah server dev PHP: satu request pada satu waktu, sehingga
# satu unduhan backup besar membekukan seluruh API selama unduhan berlangsung.
#
# Yang perlu disesuaikan kalau berbeda:
#   - kedua path /var/www/internal-backup-perwira/...
#   - versi soket php-fpm (php8.3-fpm.sock)

server {
    listen 80;
    server_name _;

    # Root default = SPA hasil build.
    root /var/www/internal-backup-perwira/frontend/dist;
    index index.html;
    charset utf-8;

    # ── Laravel ────────────────────────────────────────────────────────────────
    # ^~ supaya prefix ini menang atas `location /` tanpa bergantung urutan regex.
    # try_files mengarahkan ke front controller Laravel; internal redirect ke
    # /index.php dicocokkan ulang oleh `location ~ \.php$` di bawah.
    # REQUEST_URI yang diterima Laravel tetap URI asli, jadi routing tidak berubah.
    location ^~ /api {
        root /var/www/internal-backup-perwira/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location ^~ /sanctum {
        root /var/www/internal-backup-perwira/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/internal-backup-perwira/backend/public;

        # =404 mencegah eksekusi berkas yang tidak ada lewat path palsu.
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Unduhan backup dan remote-execute SSH bisa berjalan lama.
        # Pengganti proxy_read_timeout 300 dari konfigurasi lama.
        fastcgi_read_timeout 300;

        # Buffering dimatikan supaya unduhan backup besar (.sql.gz bisa ratusan MB)
        # tidak ditulis dulu ke berkas sementara nginx sebelum dikirim ke pengguna.
        # Konsekuensinya satu worker php-fpm tertahan selama unduhan — itu sebabnya
        # pm.max_children perlu cukup (lihat DEPLOYMENT.md bagian 7).
        fastcgi_buffering off;
    }

    # ── SPA ────────────────────────────────────────────────────────────────────
    # Semua sisanya: berkas statis kalau ada, selain itu index.html untuk React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Jangan pernah melayani berkas tersembunyi (.env, .git, dsb).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ── Header keamanan ────────────────────────────────────────────────────────
    # `always` supaya ikut terpasang pada respons error, bukan hanya 2xx/3xx.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
}
